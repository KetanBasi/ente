[package]
name = "ente-fork-worker"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "The fork's home AI worker: a headless, read-only Ente client"
publish = false

# Kept out of the upstream `rust/` workspace so upstream syncs never touch
# it; Ente's crates are used by path.
[workspace]

[[bin]]
name = "ente-worker"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
ente-core = { path = "../../rust/crates/core" }
ente-exif = { path = "../../rust/crates/exif" }
ente-image = { path = "../../rust/crates/image" }
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color", "humantime"] }
flate2 = "1.1.10"
futures-util = "0.3.32"
log = "0.4.34"
regex = "1.13.1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "gzip", "http2", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "signal"] }
toml = "0.8.23"
zeroize = { version = "1.9.0", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
mockito = "1.7.2"
tempfile = "3.27.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[lints.rust]
# Only src/secure_mem/ may use unsafe: it is the OS memory API.
unsafe_code = "deny"

[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
dbg_macro = "deny"
uninlined_format_args = "deny"
