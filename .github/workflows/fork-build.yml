name: "Fork: Build"

# Builds the self-hosted pieces of the fork from source: museum (server),
# the photos web app, the photos desktop app and the photos Android app.
# Nothing is signed or published. See fork/README.md.

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: fork-build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    server:
        name: Server (museum)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: server
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: server/go.mod
                  cache-dependency-path: server/go.sum
                  cache: true

            - name: Build museum
              run: go build -trimpath -o museum ./cmd/museum

            - name: Vet
              run: go vet ./...

            - name: Test
              run: ./scripts/test-with-postgres.sh docker

            - name: Build Docker image
              run: docker build --build-arg GIT_COMMIT="${GITHUB_SHA}" -t ente-fork/server:ci .

    web:
        name: Web (photos)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: "npm"
                  cache-dependency-path: "web/package-lock.json"

            - name: Setup Rust cache
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
              with:
                  workspaces: rust
                  shared-key: fork-rust-wasm

            - run: npm ci

            - run: npm run build:photos

            - run: npm test

    desktop:
        name: Desktop (photos, ${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        defaults:
            run:
                working-directory: desktop
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: "npm"
                  cache-dependency-path: "desktop/package-lock.json"

            - name: Install dependencies
              run: npm ci

            - name: Setup Rust cache
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
              with:
                  workspaces: rust
                  shared-key: fork-rust-desktop

            - name: Fetch binary dependencies and rebuild native modules
              run: npm run postinstall

            - name: Build
              run: npm run build:ci

            # Unsigned, unpacked build for the runner's own platform only.
            - name: Package (unsigned)
              shell: bash
              run: |
                  if [ "${RUNNER_OS}" = "Linux" ]; then
                      export TARGET_CC=clang
                      export TARGET_CXX=clang++
                  fi
                  npm exec -- electron-builder --dir --x64 --publish never \
                      -c.win.signAndEditExecutable=false
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: false
                  USE_HARD_LINKS: false

            - name: Upload unpacked app
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: photos-desktop-${{ runner.os }}
                  path: desktop/dist/*-unpacked
                  retention-days: 7
                  if-no-files-found: warn

    android:
        name: Android (photos, debug APK)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: mobile/apps/photos
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Free runner disk space
              run: sudo rm -rf /usr/share/dotnet

            - name: Setup JDK 17
              uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
              with:
                  distribution: "temurin"
                  java-version: "17"

            - name: Install Flutter
              uses: ./.github/actions/setup-flutter

            - name: Setup Rust cache
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
              with:
                  workspaces: rust
                  shared-key: fork-rust-android

            - run: flutter pub get --enforce-lockfile

            - run: cargo codegen frb photos
              working-directory: rust

            # Debug builds use the debug keystore, so no signing secrets.
            - name: Build APK
              run: flutter build apk --debug --flavor independent --dart-define=cronetHttpNoPlay=true --target-platform android-arm64

            - name: Upload APK
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: photos-android-debug
                  path: mobile/apps/photos/build/app/outputs/flutter-apk/app-independent-debug.apk
                  retention-days: 7
                  if-no-files-found: error
